// time. That way a pack sent last week still shows a current age when it is
// opened, instead of quietly reporting how old the ticket was on Monday.
const AGE=DATA.age||{}, STG=AGE._stages||[];
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const NOW=Date.now();
function days(d){ if(!d)return null; const t=Date.parse(d+'T00:00:00');
 return isNaN(t)?null:Math.round((TODAY-t)/86400000); }
// Whole units, never decimals. "2.8mo" reads like 2 months 8 of something, and
// the something is ambiguous — weeks? days? Two plain numbers cannot be misread.
const MO=30.44;
function dur(ms){
 const mins=Math.round(ms/60000);
 if(mins<60) return Math.max(1,mins)+'m';
 const hrs=Math.floor(mins/60);
 if(hrs<24) return hrs+'h';
 const d=Math.floor(ms/86400000);
 if(d<7)   return d+'d';
 if(d<31)  { const w=Math.floor(d/7), r=d%7; return w+'w'+(r?' '+r+'d':''); }
 if(d<365) { let mo=Math.floor(d/MO), r=Math.round(d-mo*MO);
             if(r>=Math.round(MO)){mo++;r=0;}          // never "1mo 30d" — that is 2mo
             return mo+'mo'+(r?' '+r+'d':''); }
 let y=Math.floor(d/365.25), rm=Math.floor((d-y*365.25)/MO);
 if(rm>=12){y++;rm=0;}
 return y+'y'+(rm?' '+rm+'mo':''); }
// The stage table is a column of numbers people add up in their head, so it uses
// ONE unit — days. Mixing "3w 2d" with "1mo 30d" and expecting the total to be
// checkable is asking too much of the reader.
function durD(ms){
 const mins=Math.round(ms/60000);
 if(mins<60) return Math.max(1,mins)+' min';
 const hrs=Math.round(ms/3600000);
 if(hrs<24) return hrs+' hr';
 return Math.round(ms/86400000)+' d'; }
// [{stage, from, to|null, ms}] — consecutive re-entries into the same stage are
// merged, because "Troubleshoot → Troubleshoot" is an update, not a new stage.
function stages(ref,closed,nowStage){
 const e=AGE[ref]; if(!e||!e.c) return null;
 const t0=Date.parse(e.c); if(isNaN(t0)) return null;
 const marks=[]; let prev=t0, cur=(e.s[0]&&STG[e.s[0][0]])||'Open';
 for(const [f,t,at] of e.s){
  const ts=Date.parse(at); if(isNaN(ts)) continue;
  const from=STG[f]||cur, to=STG[t]||'';
  if(from===to){ continue; }                       // same-stage update, keep counting
  marks.push({stage:from,from:prev,to:ts,ms:ts-prev});
  prev=ts; cur=to;
 }
 // the ticket's own status is authoritative for where it sits NOW — a transition
 // label describes an action, and a ticket can be moved back a stage
 marks.push({stage:nowStage||cur,from:prev,to:closed?null:NOW,ms:(closed?prev:NOW)-prev,open:!closed});
 // merge neighbours that ended up the same stage
 const out=[];
 for(const m of marks){ const last=out[out.length-1];
  if(last&&last.stage===m.stage){ last.to=m.to; last.ms+=m.ms; last.open=m.open; }
  else out.push(Object.assign({},m)); }
 return out;
}
function ageCls(n){ return n==null?'a0' : n>=90?'a2' : n>=30?'a1' : 'a0'; }
function human(n){ if(n==null)return '—'; if(n<1)return 'today'; return dur(n*86400000); }
// local date, not UTC — an ISO slice shifts the day for anyone east of London,
// which is why a ticket raised on 2 Jun was showing as 1 Jun
const ymd=t=>{const d=new Date(t);
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function save(){dirty=true; ST.changedAt=Date.now();
 try{localStorage.setItem(LSKEY,JSON.stringify(ST));}catch(e){LSOK=false;}
 autoQueue(); banner();}
// Comments typed here live in THIS browser until they are exported. Nothing
// deletes them — but nobody else ever sees them either. Silence about that is
// how a week of someone's notes quietly goes nowhere, so the page says it.
function unexported(){
 if(!ST.changedAt) return 0;
 if((ST.exportedAt||0) >= ST.changedAt) return 0;
 return Object.keys(ST.remarks||{}).length + Object.keys(ST.labels||{}).length;
}
function banner(){
 const w=document.getElementById('warn'); let m='';
 if(!LSOK) m='<b>This page cannot save to your browser.</b> That is normal when a file is opened directly. '+
   'Your labels and comments are held only while this tab is open — click <b>Export notes</b> before closing, or they are gone.';
 else if(unexported()&&AUTO) m='<b>Saving these to Downloads…</b> '+
   'They will be part of the shared tracker after the next refresh. '+
   '<span class="clip">Nothing to click. If this message stays put for more than a few seconds, '+
   'Chrome has blocked the automatic download — click the blocked-download icon in the address bar and allow it.</span>';
 else if(unexported()) m='<b>You have changes that only exist in this browser.</b> '+
   'Click <b>Export notes</b> and send the file, or nobody else will see them. '+
   '<span class="clip">Refreshing the tracker never deletes them — but it never shares them either.</span>';
 w.innerHTML=m; w.classList.toggle('on',!!m);}

function rows(){

  for(const f of FDEF){ if(SEL[f.id].size && !SEL[f.id].has(f.get(r))) return false; }
  // TOG has three states, not two:
  //    true  show ONLY the tickets carrying this label
  //   -1     show everything EXCEPT them  ("I've dealt with these, show me the rest")
  //   false  ignore the label
  for(const b of badgeList()){
   const t=TOG[b.id];
   if(t===true && !b.has(r[F.ref])) return false;
   if(t===-1   &&  b.has(r[F.ref])) return false; }
  if(DR){ const d=r[F.cr]||''; if(d<DR.lo||d>DR.hi) return false; }
  if(!q)return true;
  return [fullRef(r),r[F.cr],dv('m',r[F.mod]),dv('q',r[F.req]),dv('e',r[F.eid]),dv('t',r[F.dep]),dv('p',r[F.pl]),

   .join(' ').toLowerCase().includes(q);

function stemOf(n){return n.replace(/\.[^.]*$/,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function attBtn(ref,pair){
 const name=pair[0], st=stemOf(name), hit=(LOCAL[ref]||{})[st], uri=(PREV[ref]||{})[st];
 const row=R.find(x=>x[F.ref]===ref), url=row?CFG.ticketUrl.replace("{id}",row[F.id]):'';
 const ext=name.split('.').pop().toLowerCase();
 const icon= /^(png|jpe?g|gif|webp)$/.test(ext)?'🖼️' : ext==='pdf'?'📕'
           : /^(xlsx?|xlsm|csv|tsv)$/.test(ext)?'📊' : ext==='msg'?'✉️'
           : ext==='mp4'?'🎬' : /^(docx?)$/.test(ext)?'📝':'📄';
 // 1. the real file sitting beside this page — no login, no V-ONE.
 //
 //    A browser only renders a handful of types. Navigating to anything else
 //    gives a blank tab, which is what an .eml did: Chrome has no mail viewer,
 //    so it showed nothing and the file never reached Outlook. Everything the
 //    browser cannot display gets `download`, so it lands in Downloads and
 //    Windows opens it with whatever owns that extension.
 const rel=(FILES[ref]||{})[st], alt=(ALTS[ref]||{})[st];
 if(rel){
  const viewable=/^(png|jpe?g|gif|webp|bmp|svg|pdf|txt|mp4)$/.test(ext);
  // > [!note] Why there is no `download` attribute here
  // Chrome ignores it on file:// links, and there is no way round that: fetch()
  // and XHR are both blocked on file://, so the page cannot make a blob either.
  // What Chrome DOES do is download anything it cannot render — .msg, .xlsx,
  // .docx all land in Downloads and open in the right app. The one exception
  // was .eml, which it maps to message/rfc822, tries to render, and shows as a
  // blank tab. So the .msg is what a click gets, and the .eml sits beside it.
  const main=`<a class="att lnk" href="${rel}" ${viewable?'target="_blank" rel="noopener"':''}
    title="${viewable?'Opens here — no V-ONE login needed':'Downloads, then opens in the app that owns it — no V-ONE login needed'}"
    >${icon} ${esc(name)}<span class="zh">${viewable?'· open ⤓':'· downloads, opens in your app'}</span></a>`;
  // For anyone without Outlook. Deliberately not the main link: Chrome shows a
  // .eml as an empty page instead of downloading it, so it needs Save link as.
  return main + (alt
    ? ` <a class="att lnk alt" href="${alt}" title="No Outlook? Right-click this and choose Save link as — a .eml opens in Windows Mail or Thunderbird">.eml</a>`
    : '');
 }
 // 2. an image preview baked into the page
 if(uri) return `<span class="att" data-u="${st}" data-r="${esc(ref)}" data-n="${esc(name)}">${icon} ${esc(name)}<span class="zh">· click to zoom</span></span>`;
 // 3. nothing local. In a share pack, a V-ONE link is worse than useless — most
 //    of the people it goes to have no V-ONE account, so it looks like a broken
 //    promise. Say plainly that the file is not in the pack instead.

function parseDelim(txt,sep){
 const cells=[];let row=[],cur='',qq=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(qq){ if(ch==='"'&&txt[i+1]==='"'){cur+='"';i++;} else if(ch==='"'){qq=false;} else cur+=ch; }
  else if(ch==='"')qq=true;
  else if(ch===sep){row.push(cur);cur='';}
  else if(ch==='\n'){row.push(cur);cells.push(row);row=[];cur='';}
  else if(ch!=='\r')cur+=ch;}
 if(cur!==''||row.length){row.push(cur);cells.push(row);}
 return cells;}
function tableHTML(cells,path,note){
 const head=cells.shift()||[];
 const w=Math.max(head.length,...cells.map(r=>r.length));
 const pad=r=>{const c=r.slice();while(c.length<w)c.push('');return c;};
 return `<div style="max-height:76vh;overflow:auto"><table class="csvt">
  <thead><tr>${pad(head).map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
  <tbody>${cells.map(r=>`<tr>${pad(r).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="clip" style="margin-top:8px">${cells.length} rows${note||''} · the original file is unchanged at <code>${esc(path)}</code> — open it there to edit.</div>`;}

async function bash(cmd){
 const res=await window.cowork.callMcpTool('mcp__workspace__bash',{command:cmd});
 const out=(res.structuredContent&&(res.structuredContent.output||res.structuredContent.stdout))||
           (res.content&&res.content[0]&&res.content[0].text)||'';
 return {out:String(out),err:!!res.isError};}

async function view(path,name){
 const vw=document.getElementById('vw'),bd=document.getElementById('vbd');
 document.getElementById('vnm').textContent=name; bd.innerHTML='<p>Loading…</p>'; vw.classList.add('on');
 const q=path.replace(/'/g,"'\\''");
 const ext=name.split('.').pop().toLowerCase();
 try{
  // Excel: converted to a table for VIEWING only. The .xlsx on disk is never altered.
  if(ext==='xlsx'||ext==='xlsm'||ext==='xls'){
   const py="import openpyxl,sys;"
    +"wb=openpyxl.load_workbook(r'''"+path+"''',data_only=True);"
    +"ws=wb[wb.sheetnames[0]];"
    +"rows=[['' if c is None else str(c) for c in r] for r in ws.iter_rows(max_row=400,values_only=True)];"
    +"print(wb.sheetnames[0]);"
    +"print('\\n'.join('\\t'.join(x.replace('\\t',' ').replace('\\n',' ') for x in r) for r in rows))";
   const r=await bash(`python3 -c "$(cat <<'PYX'\n${py}\nPYX\n)"`);
   if(r.err||!r.out.trim()){bd.innerHTML=`<p>Could not read that workbook. Open it from <code>${esc(path)}</code>.</p>`;return;}
   const lines=r.out.replace(/\n$/,'').split('\n'); const sheet=lines.shift();
   bd.innerHTML=tableHTML(parseDelim(lines.join('\n')+'\n','\t'),path,` · sheet “${esc(sheet)}” (first 400 rows)`);
   return;}
  const r=await bash(`base64 -w0 '${q}'`);
  let b64=r.out.trim().replace(/\s+/g,'');
  if(!b64||r.err){bd.innerHTML='<p>Could not read that file.</p>';return;}
  if(ext==='csv'||ext==='tsv'){
   const txt=new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)));
   const first=txt.split('\n')[0];
   const sep=ext==='tsv'?'\t':(first.split(';').length>first.split(',').length?';':',');
   bd.innerHTML=tableHTML(parseDelim(txt,sep),path,'');
   return;}
  const mime={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',
    pdf:'application/pdf',mp4:'video/mp4',txt:'text/plain'}[ext];
  if(!mime){bd.innerHTML=`<p>No in-browser preview for .${esc(ext)} files. Open it from <code>${esc(path)}</code>.</p>`;return;}
  const src=`data:${mime};base64,${b64}`;
  bd.innerHTML = mime.startsWith('image/')?`<img src="${src}">`
   : mime==='video/mp4'?`<video src="${src}" controls style="max-width:86vw;max-height:78vh"></video>`
   : `<iframe src="${src}"></iframe>`;
 }catch(err){bd.innerHTML='<p>Preview failed: '+esc(err&&err.message||err)+'</p>';console.error(err);}
}

}

// ---- export the notes ------------------------------------------------------
// One file, one direction. Two people editing two copies is not synchronisation,
// and pretending otherwise is how a note gets silently overwritten.
//
// Every export is a COMPLETE snapshot, never a diff. That is what makes
// "newest file wins" safe on the way back in: the newest file already contains
// every older comment, so taking it can't lose one.
function notesBlob(){
 return {_what:'labels and comments for '+CFG.title,_when:new Date().toISOString(),
         labels:ST.labels,member:ST.member,remarks:ST.remarks};}
function download(obj,name){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));
 a.download=name; a.click();}

document.getElementById('exp').onclick=()=>{
 download(notesBlob(),'notes.json');
 ST.exportedAt=Date.now(); save(); banner();
 say(BAKED&&!LSOK
  ? 'Saved as notes.json.\n\nPut it in\n\n    '+(CFG.sendNotesTo||'V-ONE Tracker\\data\\incoming\\')+'\n\n'
    +'and your comments appear for everyone on the next morning\'s refresh. They are added to '
    +'whatever is already there; nothing is overwritten.\n\nRename it first if you like — '
    +'"florence.json" is easier to trace than "notes.json".'
  : 'Saved as notes.json.\n\nTo make these labels and comments part of the tracker itself — so the '
    +'shared copy carries them too — put this file in\n\n    V-ONE Tracker\\data\\notes.json\n\n'
    +'and run "2 - Refresh tracker.bat".','Notes exported');};

// ---- auto-export -----------------------------------------------------------
// The one step in the whole chain that a human can skip is the Export click, so
// on Wei's own copy it is not a click any more. A few seconds after she stops
// typing, the same complete snapshot lands in Downloads, and the next refresh
// collects it. Nothing to remember means nothing to forget on a Tuesday.
//
// > [!note] Only on the local copy
// > `autoExport` is set in clients/nsm.json and deliberately NOT in
// > clients/nsm-share.json. A file dropped in a reader's own Downloads folder
// > helps nobody and clutters their machine — R&D still export by hand, into
// > the incoming folder, which is a deliberate act of sending something.
//
// A browser cannot write to a chosen folder. Downloads is the only destination
// it is allowed to use, which is why the .bat collects from there rather than
// the page writing straight to data\notes.json.
let autoT=null, autoN=0;   // AUTO and AUTOMS are declared up with LSKEY
function autoQueue(){
 if(!AUTO) return;
 clearTimeout(autoT);
 autoT=setTimeout(autoRun,AUTOMS);          // restart on every keystroke: one
}                                           // file per edit, not one per letter
function autoRun(){
 if(!AUTO||!unexported()) return;
 try{
  download(notesBlob(),'notes-'+CID+'.json');
  ST.exportedAt=Date.now(); autoN++;
  try{localStorage.setItem(LSKEY,JSON.stringify(ST));}catch(e){}
  banner(); autoTick();
 }catch(e){ /* a blocked download must never break the page */ }
}
function autoTick(){
 const el=document.getElementById('autos'); if(!el) return;
 el.textContent='saved for the next refresh · '+new Date().toLocaleTimeString();
 el.classList.add('on'); clearTimeout(autoTick._t);
 autoTick._t=setTimeout(()=>el.classList.remove('on'),4000);
}
// If she typed something and closed the tab before the timer fired, the change
// is still in localStorage — so catch it on the way back in.
if(AUTO&&unexported()) setTimeout(autoRun,1500);
window.addEventListener('beforeunload',()=>{ if(AUTO&&unexported()) autoRun(); });

  days(r[F.cr]),days(r[F.up]),dv('m',r[F.mod]),
  dv('q',r[F.req]),dv('e',r[F.eid]),dv('t',r[F.dep]),dv('p',r[F.pl]),dv('c',r[F.cat]),dv('y',r[F.pri]),S(r),
  r[F.prob],r[F.act],r[F.sol],ST.remarks[r[F.ref]]||'',
  bl.filter(b=>b.has(r[F.ref])).map(b=>b.label).join('; '),
  (r[F.att]||[]).map(a=>a[0]).join('; ')].map(qq).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'}));
 a.download='vone-tickets.csv';a.click();};

            '· local attachment folders:',Object.keys(LOCAL).length);

</script></body></html>
